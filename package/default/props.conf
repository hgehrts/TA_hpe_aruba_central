# Events are single JSON objects written by the modular inputs with an explicit
# event time (poll time for snapshots, sample time for throughput trends).
# DATETIME_CONFIG = NONE keeps that time instead of parsing timestamps from the
# payload (e.g. lastSeenAt).

[aruba:central:ap]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
DATETIME_CONFIG = NONE
KV_MODE = json
category = Network & Security
description = HPE Aruba New Central access point (GET /network-monitoring/v1/aps), one event per AP
EVAL-vendor = "HPE Aruba Networking"
EVAL-product = "Central"
EVAL-vendor_product = "HPE Aruba Networking Central"
EVAL-dest = coalesce(deviceName, serialNumber)
EVAL-cpu_load_percent = tonumber(cpuUtilization)
FIELDALIAS-aruba_central_ap_cim = serialNumber AS serial macAddress AS mac ipv4 AS ip firmwareVersion AS version deviceName AS name

